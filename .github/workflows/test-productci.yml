name: Test Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cai thu vien
        run: npm ci

      - name: Kiem tra cu phap JavaScript
        run: find src -name '*.js' -print0 | xargs -0 -r -n 1 node --check

      - name: Test validation Product
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const Product = require("./src/models/Product");

          const data = {
            pid: "CI001",
            pname: "San pham test CI",
            price: 100000,
            quantity: 5
          };

          const valid = new Product(data);
          assert.equal(valid.validateSync(), undefined);

          const invalidPrice = new Product({ ...data, price: -1 });
          assert.ok(invalidPrice.validateSync()?.errors.price);

          const invalidQuantity = new Product({ ...data, quantity: 1.5 });
          assert.ok(invalidQuantity.validateSync()?.errors.quantity);

          console.log("PASS: Product validation");
          NODE

      - name: Build Docker image
        run: docker build -t product-api:ci .